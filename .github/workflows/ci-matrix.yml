name: Java Matrix Tests

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-matrix:
    name: test-matrix (${{ matrix.java-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: ['17', '21']
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup Java ${{ matrix.java-version }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant executable permission
        run: chmod +x gradlew

      - name: Test on Java ${{ matrix.java-version }}
        run: ./gradlew test -PtestJavaVersion=${{ matrix.java-version }} --no-daemon
